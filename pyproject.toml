[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bonsai-finance-workstation"
version = "0.2.0"
description = "Portfolio scenario review tools for Hermes and local Bonsai inference"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finance_workstation = ["sample_data/*.csv", "sample_data/*.json"]
